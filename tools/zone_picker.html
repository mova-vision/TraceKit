<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TraceKit zone picker</title>
<style>
  body { font-family: monospace; background: #111; color: #eee; margin: 20px; }
  #stage { border: 1px solid #444; cursor: crosshair; background: #000; }
  .row { margin: 8px 0; }
  button, input[type=file] { font-family: monospace; color: #eee; background: #333;
    border: 1px solid #555; padding: 6px 10px; margin-right: 8px; cursor: pointer; }
  button:hover { background: #444; }
  #points { width: 100%; height: 90px; background: #000; color: #0f0;
    border: 1px solid #555; margin-top: 6px; }
  .hint { color: #888; }
</style>
</head>
<body>
<h3>TraceKit zone picker</h3>
<div class="row">
  <input type="file" id="file" accept="image/*,video/*">
  <label><input type="checkbox" id="grid" checked> grid</label>
  <button id="undo">undo</button>
  <button id="clear">clear</button>
</div>
<div class="row"><canvas id="stage"></canvas></div>
<div class="row hint">click on the image to add points, in order (polygon closes automatically)</div>
<div class="row"><textarea id="points" readonly placeholder="points appear here"></textarea></div>

<script>
const stage = document.getElementById('stage');
const ctx = stage.getContext('2d');
const fileIn = document.getElementById('file');
const gridIn = document.getElementById('grid');
const pointsOut = document.getElementById('points');

let img = null;          // HTMLImageElement or HTMLVideoElement frame source
let pts = [];

fileIn.addEventListener('change', () => {
  const f = fileIn.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  if (f.type.startsWith('video')) {
    const v = document.createElement('video');
    v.src = url; v.muted = true;
    v.addEventListener('loadeddata', () => { v.currentTime = 0; });
    v.addEventListener('seeked', () => { img = v; load(); });
  } else {
    const i = new Image();
    i.src = url;
    i.addEventListener('load', () => { img = i; load(); });
  }
});

gridIn.addEventListener('change', load);
document.getElementById('undo').onclick = () => { pts.pop(); redraw(); };
document.getElementById('clear').onclick = () => { pts = []; redraw(); };

stage.addEventListener('click', (e) => {
  if (!img) return;
  const r = stage.getBoundingClientRect();
  pts.push([Math.round(e.clientX - r.left), Math.round(e.clientY - r.top)]);
  redraw();
});

function load() {
  const w = img.videoWidth || img.naturalWidth;
  const h = img.videoHeight || img.naturalHeight;
  stage.width = w; stage.height = h;
  pts = [];
  redraw();
}

function redraw() {
  if (!img) return;
  ctx.drawImage(img, 0, 0);
  const w = stage.width, h = stage.height;

  if (gridIn.checked) {
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1;
    for (let x = 0; x <= w; x += 50) { line(x, 0, x, h); }
    for (let y = 0; y <= h; y += 50) { line(0, y, w, y); }
    ctx.font = '14px monospace'; ctx.fillStyle = '#0f0';
    for (let x = 0; x <= w; x += 100) { if (x) ctx.fillText(x, x + 3, 16); }
    for (let y = 0; y <= h; y += 100) { if (y) ctx.fillText(y, 4, y + 16); }
  }

  // polygon + points
  ctx.strokeStyle = '#ff4040'; ctx.lineWidth = 2;
  if (pts.length > 1) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    pts.slice(1).forEach(p => ctx.lineTo(p[0], p[1]));
    if (pts.length > 2) ctx.closePath();
    ctx.stroke();
  }
  ctx.font = '13px monospace';
  pts.forEach((p, i) => {
    ctx.fillStyle = '#ff4040';
    ctx.beginPath(); ctx.arc(p[0], p[1], 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(i + 1, p[0] + 7, p[1] - 7);
  });

  pointsOut.value = pts.length
    ? 'points=[' + pts.map(p => `(${p[0]}, ${p[1]})`).join(', ') + ']'
    : '';
}

function line(x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
</script>
</body>
</html>
